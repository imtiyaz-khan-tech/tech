<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="queryexport.css">
    <title>Query Exports</title>
</head>

<body>
    <script type="text/javascript" src="jquery_min.js"></script>
    <script type="text/javascript" src="queryexport.js"></script>
    <script type="text/javascript" src="jsforce.js"></script>
    <script type="text/javascript" src="FileSavermin.js"></script>
    <div class="d_outer">
        <div class="container">
            <div class="grid-items grid-item-1">
                <div class="gc1-container">
                    <div class="gc1-grid-items ">
                        <textarea class="Keys-Box Keys" placeholder="Keys"></textarea>
                    </div>
                    <div class="gc1-grid-items ">
                        <textarea class="Keys-Box Query" placeholder="Query"></textarea>
                    </div>
                    <div class="gc1-grid-items ">
                        <textarea class="Keys-Box Fields" placeholder="Fields"></textarea>
                    </div>
                    <div class="gc1-grid-items ">
                        <textarea class="Keys-Box Max-Keys" placeholder="Max Keys"></textarea>
                    </div>
                    <div class="gc1-grid-items ">
                        <button class="execute" >Execute</button>
                    </div>
                    <div class="gc1-grid-items ">
                        <button class="copy-table" >Copy</button>
                    </div>
                </div>
            </div>
            <div class="grid-items grid-item-2">
            </div>
        </div>
    </div>
</body>
</html>
